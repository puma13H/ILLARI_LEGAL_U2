<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Carrito N:M — asociación histórica en orden_detalle"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1100" height="640" fill="#f8fafc"/><text x="30" y="38" font-family="Arial" font-size="24" fill="#0f172a">Carrito N:M — asociación histórica en orden_detalle</text><path d="M335,200 L405,200" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="375.0" y="193.0" font-family="Arial" font-size="12" fill="#334155">1 → N</text><path d="M715,210 L800,210" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="762.5" y="203.0" font-family="Arial" font-size="12" fill="#334155">N → 1 lógica</text><rect x="35" y="110" width="300" height="270" rx="8" fill="#fff" stroke="#64748b"/><text x="49" y="135" font-family="Arial" font-size="16" fill="#0f172a">ordenes_legales</text><text x="49" y="156" font-family="Arial" font-size="13" fill="#0f172a">PK id</text><text x="49" y="177" font-family="Arial" font-size="13" fill="#0f172a">id_cliente (sub)</text><text x="49" y="198" font-family="Arial" font-size="13" fill="#0f172a">total NUMERIC(12,2)</text><text x="49" y="219" font-family="Arial" font-size="13" fill="#0f172a">estado / metodo_pago</text><text x="49" y="240" font-family="Arial" font-size="13" fill="#0f172a">pago_id (referencia lógica)</text><text x="49" y="261" font-family="Arial" font-size="13" fill="#0f172a">Base: illari_ordenes</text><rect x="405" y="110" width="310" height="330" rx="8" fill="#fff" stroke="#64748b"/><text x="419" y="135" font-family="Arial" font-size="16" fill="#0f172a">orden_detalle</text><text x="419" y="156" font-family="Arial" font-size="13" fill="#0f172a">PK id</text><text x="419" y="177" font-family="Arial" font-size="13" fill="#0f172a">FK orden_id → ordenes_legales</text><text x="419" y="198" font-family="Arial" font-size="13" fill="#0f172a">posición / servicio_id</text><text x="419" y="219" font-family="Arial" font-size="13" fill="#0f172a">nombre_historico</text><text x="419" y="240" font-family="Arial" font-size="13" fill="#0f172a">cantidad</text><text x="419" y="261" font-family="Arial" font-size="13" fill="#0f172a">precio_unitario NUMERIC(12,2)</text><text x="419" y="282" font-family="Arial" font-size="13" fill="#0f172a">subtotal NUMERIC(12,2)</text><text x="419" y="303" font-family="Arial" font-size="13" fill="#0f172a">Base: illari_ordenes</text><rect x="800" y="110" width="270" height="190" rx="8" fill="#fff" stroke="#64748b"/><text x="814" y="135" font-family="Arial" font-size="16" fill="#0f172a">servicios_legales</text><text x="814" y="156" font-family="Arial" font-size="13" fill="#0f172a">PK id</text><text x="814" y="177" font-family="Arial" font-size="13" fill="#0f172a">nombre / precio vigente</text><text x="814" y="198" font-family="Arial" font-size="13" fill="#0f172a">estado</text><text x="814" y="219" font-family="Arial" font-size="13" fill="#0f172a">Base: illari_servicios</text><text x="30" y="590" font-family="Arial" font-size="13" fill="#334155">No hay FK entre detalle y la base del catálogo. Un servicio puede intervenir en distintas órdenes.</text><text x="30" y="611" font-family="Arial" font-size="13" fill="#334155">Subtotal = precio histórico × cantidad; total = suma. Orden + detalles + outbox + respuesta son atómicos.</text></svg>
