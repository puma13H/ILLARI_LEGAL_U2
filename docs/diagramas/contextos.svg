<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Bounded contexts y coordinación"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1100" height="640" fill="#f8fafc"/><text x="30" y="38" font-family="Arial" font-size="24" fill="#0f172a">Bounded contexts y coordinación</text><path d="M335,170 L400,170" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="372.5" y="163.0" font-family="Arial" font-size="12" fill="#334155">vínculo</text><path d="M680,170 L760,170" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="725.0" y="163.0" font-family="Arial" font-size="12" fill="#334155">sub</text><path d="M335,405 L400,405" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="372.5" y="398.0" font-family="Arial" font-size="12" fill="#334155">Feign</text><path d="M680,405 L760,405" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="725.0" y="398.0" font-family="Arial" font-size="12" fill="#334155">eventos Kafka</text><rect x="35" y="110" width="300" height="125" rx="8" fill="#fff" stroke="#64748b"/><text x="49" y="135" font-family="Arial" font-size="16" fill="#0f172a">Gestión jurídica (núcleo)</text><text x="49" y="156" font-family="Arial" font-size="13" fill="#0f172a">Caso / documento / mensaje</text><text x="49" y="177" font-family="Arial" font-size="13" fill="#0f172a">Agenda y asignaciones</text><text x="49" y="198" font-family="Arial" font-size="13" fill="#0f172a">Identidad local por issuer/sub</text><rect x="400" y="110" width="280" height="125" rx="8" fill="#fff" stroke="#64748b"/><text x="414" y="135" font-family="Arial" font-size="16" fill="#0f172a">Identidad</text><text x="414" y="156" font-family="Arial" font-size="13" fill="#0f172a">Keycloak</text><text x="414" y="177" font-family="Arial" font-size="13" fill="#0f172a">ADMIN / ABOGADO / CLIENTE</text><rect x="760" y="110" width="300" height="125" rx="8" fill="#fff" stroke="#64748b"/><text x="774" y="135" font-family="Arial" font-size="16" fill="#0f172a">Clientes comerciales</text><text x="774" y="156" font-family="Arial" font-size="13" fill="#0f172a">Perfil comercial</text><text x="774" y="177" font-family="Arial" font-size="13" fill="#0f172a">Subject estable</text><rect x="35" y="350" width="300" height="125" rx="8" fill="#fff" stroke="#64748b"/><text x="49" y="375" font-family="Arial" font-size="16" fill="#0f172a">Catálogo</text><text x="49" y="396" font-family="Arial" font-size="13" fill="#0f172a">Servicio / precio vigente</text><text x="49" y="417" font-family="Arial" font-size="13" fill="#0f172a">Base independiente</text><rect x="400" y="350" width="280" height="125" rx="8" fill="#fff" stroke="#64748b"/><text x="414" y="375" font-family="Arial" font-size="16" fill="#0f172a">Contratación</text><text x="414" y="396" font-family="Arial" font-size="13" fill="#0f172a">Orden + detalles históricos</text><text x="414" y="417" font-family="Arial" font-size="13" fill="#0f172a">Reserva de idempotencia</text><rect x="760" y="350" width="300" height="125" rx="8" fill="#fff" stroke="#64748b"/><text x="774" y="375" font-family="Arial" font-size="16" fill="#0f172a">Pago simulado</text><text x="774" y="396" font-family="Arial" font-size="13" fill="#0f172a">Pago único por orden</text><text x="774" y="417" font-family="Arial" font-size="13" fill="#0f172a">Compensación / revisión</text><text x="30" y="590" font-family="Arial" font-size="13" fill="#334155">Compartir el término cliente no obliga a compartir tablas entre jurídico y comercio.</text><text x="30" y="611" font-family="Arial" font-size="13" fill="#334155">Una regla transaccional pertenece a un agregado/contexto; el proceso entre contextos usa SAGA.</text></svg>
