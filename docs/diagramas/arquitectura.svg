440,300 L415,300" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M530,335 L530,420" marker-start="url(#a)" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="535.0" y="370.5" font-family="Arial" font-size="12" fill="#334155">outbox</text><path d="M625,452 L735,335" marker-start="url(#a)" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="685.0" y="386.5" font-family="Arial" font-size="12" fill="#334155">SAGA</text><rect x="30" y="80" width="180" height="70" rx="8" fill="#fff" stroke="#64748b"/><text x="44" y="105" font-family="Arial" font-size="16" fill="#0f172a">Angular / nginx</text><text x="44" y="126" font-family="Arial" font-size="13" fill="#0f172a">SPA + PKCE</text><rect x="300" y="80" width="180" height="70" rx="8" fill="#fff" stroke="#64748b"/><text x="314" y="105" font-family="Arial" font-size="16" fill="#0f172a">API Gateway</text><text x="314" y="126" font-family="Arial" font-size="13" fill="#0f172a">Rutas de negocio</text><rect x="630" y="80" width="190" height="70" rx="8" fill="#fff" stroke="#64748b"/><text x="644" y="105" font-family="Arial" font-size="16" fill="#0f172a">Keycloak</text><text x="644" y="126" font-family="Arial" font-size="13" fill="#0f172a">OIDC / JWT / roles</text><rect x="30" y="265" width="180" height="70" rx="8" fill="#fff" stroke="#64748b"/><text x="44" y="290" font-family="Arial" font-size="16" fill="#0f172a">Clientes MS</text><text x="44" y="311" font-family="Arial" font-size="13" fill="#0f172a">illari_clientes</text><rect x="235" y="265" width="180" height="70" rx="8" fill="#fff" stroke="#64748b"/><text x="249" y="290" font-family="Arial" font-size="16" fill="#0f172a">Catálogo MS</text><text x="249" y="311" font-family="Arial" font-size="13" fill="#0f172a">illari_servicios</text><rect x="440" y="265" width="180" height="70" rx="8" fill="#fff" stroke="#64748b"/><text x="454" y="290" font-family="Arial" font-size="16" fill="#0f172a">Órdenes MS</text><text x="454" y="311" font-family="Arial" font-size="13" fill="#0f172a">illari_ordenes</text><rect x="645" y="265" width="180" height="70" rx="8" fill="#fff" stroke="#64748b"/><text x="659" y="290" font-family="Arial" font-size="16" fill="#0f172a">Pagos MS</text><text x="659" y="311" font-family="Arial" font-size="13" fill="#0f172a">illari_pagos</text><rect x="850" y="265" width="220" height="70" rx="8" fill="#fff" stroke="#64748b"/><text x="864" y="290" font-family="Arial" font-size="16" fill="#0f172a">Jurídico original</text><text x="864" y="311" font-family="Arial" font-size="13" fill="#0f172a">illari_juridico</text><rect x="445" y="420" width="180" height="65" rx="8" fill="#fff" stroke="#64748b"/><text x="459" y="445" font-family="Arial" font-size="16" fill="#0f172a">Kafka</text><text x="459" y="466" font-family="Arial" font-size="13" fill="#0f172a">Comandos / resultados</text><rect x="30" y="420" width="290" height="95" rx="8" fill="#fff" stroke="#64748b"/><text x="44" y="445" font-family="Arial" font-size="16" fill="#0f172a">Configuración y registro</text><text x="44" y="466" font-family="Arial" font-size="13" fill="#0f172a">Config Server + Eureka</text><text x="44" y="487" font-family="Arial" font-size="13" fill="#0f172a">Clientes Spring/Feign</text><rect x="760" y="420" width="310" height="95" rx="8" fill="#fff" stroke="#64748b"/><text x="774" y="445" font-family="Arial" font-size="16" fill="#0f172a">Observabilidad</text><text x="774" y="466" font-family="Arial" font-size="13" fill="#0f172a">Prometheus → Grafana</text><text x="774" y="487" font-family="Arial" font-size="13" fill="#0f172a">Logs → Alloy → Loki</text><text x="30" y="590" font-family="Arial" font-size="13" fill="#334155">Seis bases separadas en PostgreSQL: comerciales, jurídico y Keycloak; sin FK entre bases.</text><text x="30" y="611" font-family="Arial" font-size="13" fill="#334155">El broker no reemplaza la transacción local. Diagnóstico protegido y puertos de laboratorio en loopback.</text><text x="445" y="254" font-family="Arial" font-size="12" fill="#334155">Feign hacia Catálogo</text></svg>
