# Perfil Docker - PostgreSQL en contenedor
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/casos_legales
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
