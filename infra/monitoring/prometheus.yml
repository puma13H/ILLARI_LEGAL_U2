global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: legal-gateway
    metrics_path: /actuator/prometheus
    scrape_timeout: 4s
    static_configs:
      - targets: ['legal-gateway:18080']
  - job_name: cliente-ms
    metrics_path: /actuator/prometheus
    scrape_timeout: 4s
    static_configs:
      - targets: ['cliente-ms:8081']
  - job_name: servicio-legal-ms
    metrics_path: /actuator/prometheus
    scrape_timeout: 4s
    static_configs:
      - targets: ['servicio-legal-ms:8082']
  - job_name: orden-legal-ms
    metrics_path: /actuator/prometheus
    scrape_timeout: 4s
    static_configs:
      - targets: ['orden-legal-ms:8083']
  - job_name: pago-ms
    metrics_path: /actuator/prometheus
    scrape_timeout: 4s
    static_configs:
      - targets: ['pago-ms:8084']
  - job_name: backend-legacy
    metrics_path: /actuator/prometheus
    scrape_timeout: 4s
    static_configs:
      - targets: ['backend-legacy:8080']
  - job_name: illari-readiness
    metrics_path: /probe
    params: {module: [http_ready]}
    static_configs:
      - targets:
          - http://legal-gateway:18080/actuator/health/readiness
          - http://cliente-ms:8081/actuator/health/readiness
          - http://servicio-legal-ms:8082/actuator/health/readiness
          - http://orden-legal-ms:8083/actuator/health/readiness
          - http://pago-ms:8084/actuator/health/readiness
          - http://backend-legacy:8080/actuator/health/readiness
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'blackbox:9115'}
