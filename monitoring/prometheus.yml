global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "illari-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["legal-gateway:18080"]

  - job_name: "illari-cliente"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cliente-ms:8081"]

  - job_name: "illari-servicio-legal"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["servicio-legal-ms:8082"]

  - job_name: "illari-orden"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orden-legal-ms:8083"]

  - job_name: "illari-pago"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pago-ms:8084"]
